[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatscope"
version = "0.10.0"
description = "Local, editable rhythm maps from audio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["audio-visualization", "music", "rhythm", "creative-coding", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24", "soundfile>=0.12", "librosa>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "mcp>=2,<3", "anyio>=4", "ruff>=0.9", "setuptools>=68"]
high-quality = ["demucs>=4.1"]
mcp = ["mcp>=2,<3"]

[project.scripts]
beatscope = "beatscope.cli:main"
beatscope-mcp = "beatscope.mcp.server:main"

[tool.setuptools.packages.find]
include = ["beatscope*"]

[tool.setuptools.package-data]
beatscope = [
  "web/*.html", "web/*.js", "web/*.css", "web/webmcp/*.js",
  "runtime/*.js", "runtime/*.mjs",
  "agent_skill/*.md", "agent_skill/references/*.md",
  "mcp/*.mjs", "mcp/data/*.json",
]

# Release policy: the WebMCP Director modules ship in the wheel so
# the Studio player works offline; the frozen demo audio/fixtures stay out -
# they belong to the static demo bundle that scripts/build_webmcp_demo.py
# assembles and the demo host serves (see docs/webmcp.md).

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
# Start with correctness rules so existing style debt does not hide real failures.
# Broader formatting/style adoption can then happen in reviewable, isolated changes.
select = ["E9", "F63", "F7", "F82"]
