[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatscope"
version = "0.12.1"
description = "Local music timing analysis, deterministic video preview, and portable Agent handoffs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["audio-visualization", "music", "rhythm", "creative-coding", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24", "soundfile>=0.12", "librosa>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "mcp>=2,<3", "anyio>=4", "ruff>=0.9", "mypy>=2", "setuptools>=68"]
high-quality = ["demucs>=4.1"]
mcp = ["mcp>=2,<3"]
public-benchmark = ["mir_eval>=0.8,<1", "beat-this>=1.1,<2"]

[project.scripts]
beatscope = "beatscope.cli:main"
beatscope-mcp = "beatscope.mcp.server:main"

[tool.setuptools.packages.find]
include = ["beatscope*"]

[tool.setuptools.package-data]
beatscope = [
  "web/*.html", "web/*.mjs",
  "web/app/*.html", "web/app/*.webp", "web/app/assets/*", "web/app/fonts/*",
  "runtime/*.js", "runtime/*.mjs",
  "agent_skill/*.md", "agent_skill/references/*.md",
  "mcp/*.mjs", "mcp/data/*.json",
  "data/*.json",
]

# Release policy: the studio page and the shared runtime modules ship in the
# wheel so a local install serves the studio offline; the built frontend under
# web/app is packaged the same way.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
# Start with correctness rules so existing style debt does not hide real failures.
# Broader formatting/style adoption can then happen in reviewable, isolated changes.
select = ["E", "F", "W", "I", "B"]
# E501 is exempted because this repository deliberately writes compact single-line
# payload literals - analysis result dicts, MIDI event rows, benchmark fixtures.
# ~170 lines exceed the 120 column limit and the tail runs past 600 characters;
# wrapping them by hand would reformat every payload diff without making any of
# them easier to read. Length discipline needs a formatter pass (ruff format),
# which is a separate, much larger decision than this lint gate.
#
# E701/E702 (multiple statements on one line) are a deliberate house style in
# this repository: compact one-liners keep short guards and test setup readable.
# They are exempted as a style decision, not because they are hard to fix.
ignore = ["E501", "E701", "E702"]

[tool.mypy]
# Checked against the interpreter the CI core job runs. Pinning this to the
# 3.10 floor instead would stop mypy at the first import: numpy 2.x ships
# PEP 695 `type` statements in its stubs, which only parse from 3.12 on, and
# every numpy value would silently degrade to Any. The 3.10 floor is enforced
# where it counts - the separate CI job that installs and runs the suite on
# 3.10 - rather than by telling mypy about an older stdlib.
python_version = "3.12"
# librosa, soundfile and friends ship no stubs; their imports are Any by design.
ignore_missing_imports = true
# Bodies of unannotated functions are still checked - the point of this gate is
# to catch real mistakes, not to reward adding annotations to silent code.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Each `# type: ignore` must name its error code, so an ignore cannot silently
# outlive the error it was written for.
enable_error_code = ["ignore-without-code"]
