<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeatScope composition</title>
<style>@font-face{font-family:Geist;src:url('./fonts/Geist-Variable.woff2')}*{box-sizing:border-box}body{margin:0;background:#ededea;color:#333;font:14px Geist,system-ui}header{padding:14px;display:flex;gap:18px;align-items:center;background:#faf9f6}#stage{position:relative;margin:auto;overflow:hidden;transform-origin:top left}#holder{position:relative;margin:24px auto}canvas{position:absolute;inset:0;width:100%;height:100%}.object{position:absolute;transform-origin:center}.crop{position:absolute;inset:0;overflow:hidden}.content{position:absolute}img,video{width:100%;height:100%;object-fit:cover;display:block}.text{font-weight:600;line-height:1.05;white-space:pre-wrap;overflow-wrap:anywhere}#error{padding:12px;color:#9d3420}audio{max-width:45vw}</style>
<header><label>Relink original audio <input id="file" type="file" accept="audio/*"></label><audio id="audio" controls></audio><span id="status">Audio is not included.</span></header><div id="error" role="alert"></div><div id="holder"><div id="stage"></div></div><script type="module" src="./preview.mjs"></script></html>
