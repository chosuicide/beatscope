name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by the release workflow as its pre-publish gate; the tag push that
  # triggers a release calls this workflow with the tag's own commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: Install
        run: |
          python -m pip install -e ".[dev,mcp]"
          npm ci --prefix web-src --no-audit --no-fund
      - name: Build the studio the server serves
        run: |
          npm ci --prefix web-src --no-audit --no-fund
          npm run build --prefix web-src
      - name: Lint
        run: python -m ruff check beatscope scripts tests evaluations
      - name: Type check
        run: python -m mypy beatscope
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: npm run test:js
      - name: Benchmark gates
        run: python -m beatscope.cli benchmark --output-dir build/benchmark-ci

  windows:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Set up Node for the studio build
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the studio the wheel ships
        run: |
          npm ci --prefix web-src --no-audit --no-fund
          npm run build --prefix web-src
      - name: Cross-platform contract tests
        run: >-
          python -m pytest -q
          tests/test_schema.py
          tests/test_pipeline.py
          tests/test_consumer_contract.py
          tests/mcp

  studio:
    name: Studio and WebMCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: Install
        run: |
          python -m pip install -e .
          npm ci --prefix web-src --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck --prefix web-src
          npm run build --prefix web-src
      - name: Studio and WebMCP contracts
        run: >-
          node --test
          tests/test_movie_plan.js
          tests/test_movie_safety.js
          tests/test_studio_session.js
          tests/test_studio_webmcp_contracts.js
          tests/test_studio_webmcp_queries.js
          tests/test_studio_webmcp_actions.js
          tests/test_studio_webmcp_registration.js
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Browser round trip
        shell: bash
        run: |
          mkdir -p build
          python tests/browser/studio_webmcp_server.py --port 8771 > build/studio-webmcp-server.json 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8771/app/ > /dev/null && break
            sleep 1
          done
          node tests/browser/studio-webmcp-smoke.mjs http://127.0.0.1:8771
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-webmcp-failure
          path: build/studio-webmcp-server.json
          retention-days: 7
